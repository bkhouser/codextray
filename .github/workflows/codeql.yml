name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 8 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - run: dotnet restore CodexTray.slnx --locked-mode
      - run: dotnet build CodexTray.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
